# The visual editor's contract for sections/hero.blade.php: each field maps to
# a prop in the component's @props. Defaults fill any attribute the page doesn't
# pass. Field names are camelCase, matching the props they fill.
title: Hero
description: The opening statement — badge, headline, supporting copy, and two actions
fields:
    badge:
        type: text
        label: Badge
        description: The small pill above the headline.
        default: "Welcome to your new site"
    heading:
        type: text
        label: Heading
        default: "Start with a Blank Canvas."
    body:
        type: textarea
        label: Supporting copy
        default: "DevDojo Sites gives you everything you need to build stunning, high-performance websites. Fully customizable. Totally yours."
    background:
        type: image
        label: Background photo
        description: Fills the right side of the hero and runs up behind the nav.
        default: "/hero-background.jpg"
    buttonText:
        type: text
        label: Primary button text
        default: "Get started"
    buttonLink:
        type: url
        label: Primary button link
        default: "https://devdojo.com/docs/sites/getting-started"
    secondaryText:
        type: text
        label: Secondary button text
        default: "Read the docs"
    secondaryLink:
        type: url
        label: Secondary button link
        default: "https://devdojo.com/docs"
